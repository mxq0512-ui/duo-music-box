name: Unzip uploaded project
on:
  push:
    branches: [main]
    paths:
      - 'duo-music-box-contents.zip'
      - '.github/workflows/unzip.yml'
permissions:
  contents: write
  workflows: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract zip and commit
        run: |
          if [ ! -f duo-music-box-contents.zip ]; then echo "No zip found"; exit 0; fi
          unzip -o duo-music-box-contents.zip -d .
          rm duo-music-box-contents.zip .github/workflows/unzip.yml
          git config user.name "mxq0512-ui"
          git config user.email "mxq0512-ui@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Phase 1: DUO MUSIC BOX SwiftUI independent implementation + iOS CI workflow" || exit 0
          git push
