name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    name: Simulator screenshots on cloud Mac
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build app for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DuoMusicBox.xcodeproj \
            -scheme DuoMusicBox \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Boot simulator, install, screenshot 3 states
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/shots"
          APP_PATH=$(find build/DerivedData/Build/Products -name 'DuoMusicBox.app' -type d | head -1)
          echo "App: $APP_PATH"
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin); rt=[v for k,v in d['devices'].items() if 'iOS' in k]; flat=[x for vs in rt for x in vs if 'iPhone' in x['name']]; print(flat[0]['udid'])")
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" com.jacky.duomusicbox
          sleep 3
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/01-closed.png"
          xcrun simctl terminate "$UDID" com.jacky.duomusicbox || true
          xcrun simctl launch "$UDID" com.jacky.duomusicbox SCREENSHOT_OPEN_LISTEN
          sleep 8
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/02-listen.png"
          sleep 5
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/05-listen-late.png"
          xcrun simctl terminate "$UDID" com.jacky.duomusicbox || true
          xcrun simctl launch "$UDID" com.jacky.duomusicbox SCREENSHOT_OPEN_COMPOSE
          sleep 6
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/03-compose.png"
          sleep 5
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/04-compose-late.png"
          xcrun simctl terminate "$UDID" com.jacky.duomusicbox || true
          xcrun simctl launch "$UDID" com.jacky.duomusicbox SCREENSHOT_OPEN_COMPOSE DBG_TOP
          sleep 6
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/06-diag-top.png"
          xcrun simctl terminate "$UDID" com.jacky.duomusicbox || true
          xcrun simctl launch "$UDID" com.jacky.duomusicbox SCREENSHOT_OPEN_LISTEN DBG_HIDE_DRUM
          sleep 8
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/07-diag-nodrum.png"
          xcrun simctl terminate "$UDID" com.jacky.duomusicbox || true
          find ~/Library/Developer/CoreSimulator/Devices/"$UDID"/data/Library/Logs -name 'DuoMusicBox*' -exec cp {} "$RUNNER_TEMP/shots/" \; 2>/dev/null || true
          ls -la "$RUNNER_TEMP/shots"

      - name: Publish screenshots to ci-screenshots branch
        run: |
          set -e
          cp "$RUNNER_TEMP"/shots/*.png /tmp/
          cp "$RUNNER_TEMP"/shots/*.ips /tmp/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan ci-screenshots
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/01-closed.png /tmp/02-listen.png /tmp/03-compose.png /tmp/04-compose-late.png /tmp/05-listen-late.png /tmp/06-diag-top.png /tmp/07-diag-nodrum.png .
          cp /tmp/*.ips . 2>/dev/null || true
          printf '# CI simulator screenshots\n\nLatest run: %s\n' "$(date -u +%FT%TZ)" > README.md
          git add .
          git commit -m "Simulator screenshots (run ${{ github.run_number }})"
          git push -f origin ci-screenshots

      - name: Upload screenshots artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ${{ runner.temp }}/shots/*.png
            build.log
          if-no-files-found: ignore
